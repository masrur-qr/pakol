    <!-- Bread Crumb STRAT -->
    <section class="bread bread-banner">
      <div class="container">
        <div class="bread-detail text-center d-md-flex align-items-center justify-content-between">
            <h4 class="bread-title mb-3 mb-md-0">About us</h4>
            <div class="bread-crumb">
              <ul>
                  <li class="breadcrumb-item"><a href="/"><i class="fa fa-home"></i> Home</a></li>
                  <li class="breadcrumb-item active"><a href="#">About us</a></li>
              </ul>
            </div>
        </div>
      </div>
    </section>
    <!-- Bread Crumb END --> 



    <!-- about-part Start --> 
    <section id="about" class="ptb-100">

          <div class="about-detail">
            <div class="about-part">

                        <div class="video-bg">
                          <div class="video-delail text-center">
                            <div class="video-block">
                              <a class="popup-youtube" href="https://www.youtube.com/watch?v=_-6CyjXvntw">
                                <span></span>
                              </a>
                            </div>
                          </div>
                        </div>
                    </div>
                  </div>
                  <div class="col-xl-7 col-lg-6 order-lg-1">
                    <div class="">
                      <div class="heading-part mb-30 mb-sm-20">
                        <h2 class="main_title heading">Welcome</h2>
                      </div>
                      {% autoescape off %}
                          {{page.Content}}
                      {% endautoescape %}
                    </div>
                  </div>
                </div>
              </div>
              
            </div>
          </div>
        </div>
    </section>
